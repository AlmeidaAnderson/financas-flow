<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças Flow</title>
<meta name="description" content="Suas finanças pessoais: importe extratos e faturas, categorize e veja para onde vai o dinheiro.">
<meta name="theme-color" content="#EDF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E181C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<script src="vendor/xlsx.full.min.js" defer></script>
<script src="engine.js" defer></script>
<script src="store.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="3" width="5" height="22" rx="2" fill="var(--in)"/><path d="M7 6 C14 6 14 12 21 12 L21 16 C14 16 14 10 7 10Z" fill="var(--accent)" opacity=".55"/><path d="M7 14 C14 14 14 20 21 20 L21 24 C14 24 14 18 7 18Z" fill="var(--ipe)" opacity=".6"/><rect x="21" y="9" width="5" height="16" rx="2" fill="var(--accent)"/></svg>
      <div class="brand-txt"><h1>Finanças <span>Flow</span></h1><span id="store-pill" class="store-pill" role="status" aria-live="polite">Carregando…</span></div>
    </div>
    <button class="icon-btn bell-btn" id="btn-alerts" type="button" aria-label="Alertas de atualização" data-act="alerts" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2H5z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
      <span class="bell-badge" id="alerts-badge" hidden></span>
    </button>
    <button class="acct-btn" id="btn-account" type="button" aria-label="Conta" data-act="account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 19.5c1.4-3.4 4-5 7.2-5s5.8 1.6 7.2 5"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="Ajustes" data-act="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <div id="example-banner" hidden></div>
  <section id="scr-painel" class="screen" aria-label="Painel"><div class="empty"><span class="spinner"></span><span class="small">Carregando…</span></div></section>
  <section id="scr-tx" class="screen" aria-label="Transações" hidden></section>
  <section id="scr-import" class="screen" aria-label="Importar" hidden></section>
  <section id="scr-cats" class="screen" aria-label="Categorias" hidden></section>
  <noscript><div class="banner err"><div><b>Ative o JavaScript</b> para usar o Finanças Flow.</div></div></noscript>
</main>

<nav class="tabbar" aria-label="Seções">
  <div class="tabbar-in">
    <button class="tab" type="button" data-tab="painel" id="tab-painel" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 5h3v14H3zM18 8h3v11h-3z"/><path d="M6 7c6 0 6 5 12 5M6 15c6 0 6-2 12-2"/></svg>
      Painel</button>
    <button class="tab" type="button" data-tab="tx" id="tab-tx">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Transações<span class="badge" id="tab-badge" hidden></span></button>
    <button class="tab" type="button" data-tab="import" id="tab-import">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg>
      Importar</button>
    <button class="tab" type="button" data-tab="cats" id="tab-cats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/><path d="M14 17h6M17 14v6"/></svg>
      Categorias</button>
  </div>
</nav>

<div id="sheet-root"></div>
<div id="triage-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
